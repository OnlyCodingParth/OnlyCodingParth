name: Generate Contribution Snake

# Generates the animated contribution snake and publishes it to the
# "output" branch. The branch is created by the publish step if missing.
# See docs/ASSET-GUIDE.md ("Enable the contribution snake").

on:
  workflow_dispatch:        # manual: Actions tab -> Run workflow
  schedule:
    - cron: "0 */12 * * *"  # every 12 hours (UTC)

permissions:
  contents: write           # required to push to the output branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: OnlyCodingParth
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#1f3a5f,#2f5fa8,#58A6FF,#A371F7

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
